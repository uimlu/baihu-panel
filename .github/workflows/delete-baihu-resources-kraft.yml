name: Delete Baihu Resources (Unikraft CLI)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "要删除的镜像标签，例如 33519613088 或 GitHub run_id"
        required: true
        default: "33519613088"
        type: string
      confirmation:
        description: "请输入 DELETE_BAIHU 以确认删除实例、镜像和 Volume"
        required: true
        type: string

permissions:
  contents: read

env:
  UKC_METRO: fra
  UKC_ORGANIZATION: mingy
  BAIHU_INSTANCE: baihu
  BAIHU_VOLUME: baihu-data
  BAIHU_IMAGE_REPOSITORY: mingy/baihu

jobs:
  delete-baihu:
    name: Delete Baihu resources
    runs-on: ubuntu-latest
    env:
      UKC_TOKEN: ${{ secrets.UKC_TOKEN }}

    steps:
      - name: Install latest Unikraft CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://get.kraftkit.sh \
            | sudo -E sh -s -- -y
          export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:$PATH"
          command -v unikraft
          unikraft version

      - name: Validate deletion confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "DELETE_BAIHU" ]; then
            echo "错误：确认文本必须精确等于 DELETE_BAIHU。"
            exit 1
          fi
          if [ -z "${UKC_TOKEN:-}" ]; then
            echo "错误：没有找到 GitHub Secret UKC_TOKEN。"
            exit 1
          fi
          if [[ "$UKC_TOKEN" == Bearer\ * || "$UKC_TOKEN" =~ [[:space:]] ]]; then
            echo "错误：UKC_TOKEN 不要包含 Bearer 前缀或空白字符。"
            exit 1
          fi

      - name: List target resources
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:$PATH"
          unikraft instances list
          unikraft volumes list
          unikraft images list
          exit 0

      - name: Remove Baihu instance when present
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:$PATH"
          INSTANCES="$(unikraft instances list 2>&1 || true)"
          if printf '%s\n' "$INSTANCES" | grep -Fq "$BAIHU_INSTANCE"; then
            unikraft instances stop "$BAIHU_INSTANCE" || true
            unikraft volumes detach "$BAIHU_VOLUME" --from "$BAIHU_INSTANCE" || true
            unikraft instances delete "$BAIHU_INSTANCE"
            echo "实例 $BAIHU_INSTANCE 删除成功。"
          else
            echo "未找到实例 $BAIHU_INSTANCE，视为已清理。"
          fi

      - name: Remove Baihu image tag when present
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:$PATH"
          IMAGE_REF="$BAIHU_IMAGE_REPOSITORY:$IMAGE_TAG"
          IMAGES="$(unikraft images list 2>&1 || true)"
          if printf '%s\n' "$IMAGES" | grep -Fq "$IMAGE_REF" || \
             printf '%s\n' "$IMAGES" | grep -Fq "$IMAGE_TAG"; then
            unikraft images delete "$IMAGE_REF"
            echo "镜像 $IMAGE_REF 删除成功。"
          else
            echo "未找到镜像 $IMAGE_REF，视为已清理。"
          fi

      - name: Remove Baihu volume when present
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:$PATH"
          VOLUMES="$(unikraft volumes list 2>&1 || true)"
          if printf '%s\n' "$VOLUMES" | grep -Fq "$BAIHU_VOLUME"; then
            if unikraft volume delete "$BAIHU_VOLUME"; then
              :
            else
              unikraft volumes delete "$BAIHU_VOLUME"
            fi
            echo "Volume $BAIHU_VOLUME 删除成功。"
          else
            echo "未找到 Volume $BAIHU_VOLUME，视为已清理。"
          fi

      - name: Write deletion summary
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          {
            echo "## 白虎面板资源清理完成"
            echo
            echo "- Metro：$UKC_METRO"
            echo "- 实例：$BAIHU_INSTANCE"
            echo "- 镜像：$BAIHU_IMAGE_REPOSITORY:$IMAGE_TAG"
            echo "- Volume：$BAIHU_VOLUME"
            echo
            echo "未操作 OpenList 及其 Volume。"
          } >> "$GITHUB_STEP_SUMMARY"

