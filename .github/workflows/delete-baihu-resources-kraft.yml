name: Delete Baihu Resources (Simple)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "要删除的镜像标签"
        required: true
        default: "33519613088"
        type: string
      confirmation:
        description: "请输入 DELETE_BAIHU 确认删除"
        required: true
        type: string

permissions:
  contents: read

env:
  UKC_METRO: fra
  BAIHU_INSTANCE: baihu
  BAIHU_VOLUME: baihu-data
  BAIHU_IMAGE: mingy/baihu
  KRAFTKIT_NO_WARN_CLOUD_DEPRECATION: "1"

jobs:
  delete:
    name: Delete Baihu instance, image and volume
    runs-on: ubuntu-latest
    env:
      UKC_TOKEN: ${{ secrets.UKC_TOKEN }}

    steps:
      - name: Install KraftKit without prompts
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://deb.pkg.kraftkit.sh/gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/unikraft.gpg
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/unikraft.gpg] https://deb.pkg.kraftkit.sh /' \
            | sudo tee /etc/apt/sources.list.d/kraftkit.list >/dev/null
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kraftkit
          command -v kraft
          kraft version

      - name: Confirm deletion
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DELETE_BAIHU"
          test -n "${UKC_TOKEN:-}"

      - name: List Baihu resources
        shell: bash
        run: |
          set +e
          kraft cloud --metro "$UKC_METRO" --token "$UKC_TOKEN" instance list
          kraft cloud --metro "$UKC_METRO" --token "$UKC_TOKEN" img list
          kraft cloud --metro "$UKC_METRO" --token "$UKC_TOKEN" vol list
          exit 0

      - name: Delete Baihu resources
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set +e
          kraft cloud --metro "$UKC_METRO" --token "$UKC_TOKEN" instance remove "$BAIHU_INSTANCE"
          kraft cloud --metro "$UKC_METRO" --token "$UKC_TOKEN" img remove "$BAIHU_IMAGE:$IMAGE_TAG"
          kraft cloud --metro "$UKC_METRO" --token "$UKC_TOKEN" vol remove "$BAIHU_VOLUME"
          exit 0

      - name: Write summary
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          {
            echo "## 白虎面板清理命令已执行"
            echo
            echo "- Metro：$UKC_METRO"
            echo "- 实例：$BAIHU_INSTANCE"
            echo "- 镜像：$BAIHU_IMAGE:$IMAGE_TAG"
            echo "- Volume：$BAIHU_VOLUME"
            echo
            echo "删除命令即使遇到资源不存在也会继续完成。请以上一步资源列表和 Unikraft 控制台为准确认结果。"
          } >> "$GITHUB_STEP_SUMMARY"

