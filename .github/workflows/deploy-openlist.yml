name: Deploy Baihu Panel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      UKC_METRO: sfo
      UKC_ORGANIZATION: mingy
      BAIHU_REPOSITORY: uimlu/baihu-panel
      BAIHU_BRANCH: main
      BAIHU_IMAGE: index.unikraft.io/mingy/baihu:latest
      BAIHU_INSTANCE: baihu
      BAIHU_VOLUME: baihu-data

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Install Unikraft CLI
        shell: bash
        run: |
          set -euo pipefail

          curl --proto '=https' --tlsv1.2 -fsSL \
            https://unikraft.com/cli/install.sh | sh

          CLI_PATH="$(command -v unikraft || true)"
          if [ -z "$CLI_PATH" ]; then
            for DIR in "$HOME/.local/bin" "$HOME/bin" "/usr/local/bin"; do
              if [ -x "$DIR/unikraft" ]; then
                CLI_PATH="$DIR/unikraft"
                break
              fi
            done
          fi

          if [ -z "$CLI_PATH" ]; then
            echo "错误：找不到 unikraft CLI。"
            exit 1
          fi

          CLI_DIR="$(dirname "$CLI_PATH")"
          echo "$CLI_DIR" >> "$GITHUB_PATH"
          export PATH="$CLI_DIR:$PATH"
          command -v unikraft
          unikraft --help

      - name: Configure Unikraft profile
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${UKC_TOKEN:-}" ]; then
            echo "错误：没有找到 GitHub Secret UKC_TOKEN。"
            exit 1
          fi

          if [[ "$UKC_TOKEN" == Bearer\ * ]]; then
            echo "错误：UKC_TOKEN 不要包含 Bearer 前缀。"
            exit 1
          fi

          if [[ "$UKC_TOKEN" =~ [[:space:]] ]]; then
            echo "错误：UKC_TOKEN 包含空白字符。"
            exit 1
          fi

          export UNIKRAFT_CONFIG="$RUNNER_TEMP/unikraft-config.yaml"
          echo "UNIKRAFT_CONFIG=$UNIKRAFT_CONFIG" >> "$GITHUB_ENV"

          cat > "$UNIKRAFT_CONFIG" <<EOF
          profiles:
            default:
              type: cloud
              token: "$UKC_TOKEN"
              organization: "$UKC_ORGANIZATION"
              metros:
                - name: "$UKC_METRO"
                  endpoint: "https://api.$UKC_METRO.unikraft.cloud"
                  country: "US"
          EOF

          chmod 600 "$UNIKRAFT_CONFIG"

          unikraft \
            --config "$UNIKRAFT_CONFIG" \
            profile list

      - name: Delete existing Baihu Registry image
        shell: bash
        run: |
          set -euo pipefail

          echo "删除前的 Registry 镜像列表："

          unikraft \
            --config "$UNIKRAFT_CONFIG" \
            --timeout 5m \
            images list

          echo ""
          echo "正在删除已有的白虎面板镜像：mingy/baihu"

          if unikraft \
            --config "$UNIKRAFT_CONFIG" \
            --timeout 10m \
            images delete mingy/baihu; then
            echo "旧的 mingy/baihu 镜像删除成功。"
          else
            echo "未找到旧的 mingy/baihu 镜像，继续执行构建。"
          fi

          echo ""
          echo "等待 Registry 清理旧镜像层..."
          sleep 60

          echo "删除后的 Registry 镜像列表："

          unikraft \
            --config "$UNIKRAFT_CONFIG" \
            --timeout 5m \
            images list

      - name: Checkout Baihu source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BAIHU_REPOSITORY }}
          ref: ${{ env.BAIHU_BRANCH }}
          path: baihu
          fetch-depth: 1

      - name: Prepare Baihu build context
        shell: bash
        run: |
          set -euo pipefail

          test -f baihu/docker/Dockerfile
          test -f baihu/docker/docker-entrypoint.sh
          test -f baihu/go.mod
          test -f baihu/go.sum
          test -f baihu/web/package.json

          # Dockerfile 需要仓库根目录作为构建上下文。
          cp baihu/docker/Dockerfile baihu/Dockerfile

          cat > baihu/Kraftfile <<'EOF'
          spec: v0.7

          runtime: base-compat:latest

          rootfs:
            source: ./Dockerfile
            format: erofs
          EOF

          echo "Baihu 构建目录："
          ls -la baihu

          echo "Kraftfile："
          cat baihu/Kraftfile

      - name: Build and push Baihu image
        shell: bash
        run: |
          set -euo pipefail

          cd baihu

          echo "正在重新构建完整的白虎面板镜像..."
          echo "构建目录：$(pwd)"
          echo "镜像地址：$BAIHU_IMAGE"

          unikraft \
            --config "$UNIKRAFT_CONFIG" \
            --timeout 60m \
            build . \
            --output "$BAIHU_IMAGE"

          echo "白虎面板完整镜像构建和推送完成。"

          cd ..
          echo "等待 Registry 同步镜像..."
          sleep 180

      - name: Create Baihu data volume
        shell: bash
        run: |
          set -euo pipefail

          VOLUME_INFO="$(
            unikraft \
              --config "$UNIKRAFT_CONFIG" \
              --timeout 5m \
              volumes list 2>&1 || true
          )"

          echo "$VOLUME_INFO"

          if printf '%s\n' "$VOLUME_INFO" | grep -Fq "$BAIHU_VOLUME"; then
            echo "Volume $BAIHU_VOLUME 已存在，继续使用。"
          else
            echo "正在创建 Volume $BAIHU_VOLUME..."

            unikraft \
              --config "$UNIKRAFT_CONFIG" \
              --timeout 10m \
              volume create \
              --metro "$UKC_METRO" \
              --name "$BAIHU_VOLUME" \
              --size 1024M
          fi

      - name: Verify Baihu image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_INFO="$(
            unikraft \
              --config "$UNIKRAFT_CONFIG" \
              --timeout 5m \
              images list
          )"

          echo "$IMAGE_INFO"

          if ! printf '%s\n' "$IMAGE_INFO" | grep -Eqi \
            '(^|[[:space:]])mingy/baihu([:@[:space:]]|$)'; then
            echo "错误：Registry 中没有找到 Baihu 镜像。"
            exit 1
          fi

          echo "白虎面板镜像确认存在：$BAIHU_IMAGE"

      - name: Delete old Baihu instance only
        shell: bash
        run: |
          set +e

          echo "尝试删除旧的 Baihu 实例..."

          printf 'y\n' | unikraft \
            --config "$UNIKRAFT_CONFIG" \
            instances delete "$BAIHU_INSTANCE"

          echo "旧实例清理完成。"
          echo "不会删除 openlist、openlist-data 或 $BAIHU_VOLUME。"

      - name: Start Baihu instance
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # 仅使用 UKC_TOKEN 派生稳定的应用密钥，不需要新增 GitHub Secret。
          BAIHU_SECRET_KEY="$(
            printf '%s' "$UKC_TOKEN" | sha256sum | awk '{print $1}'
          )"

          echo "正在启动白虎面板..."
          echo "Metro: $UKC_METRO"
          echo "Instance: $BAIHU_INSTANCE"
          echo "Image: $BAIHU_IMAGE"
          echo "CPU: 1 vCPU"
          echo "Memory: 2048M"
          echo "Port: 8052"

          unikraft \
            --config "$UNIKRAFT_CONFIG" \
            --timeout 30m \
            run \
            --metro "$UKC_METRO" \
            --name "$BAIHU_INSTANCE" \
            --image "$BAIHU_IMAGE" \
            --cmd "/app/baihu server" \
            --vcpus 1 \
            --memory 2048M \
            --restart always \
            --publish 443:8052/http+tls \
            --volume "$BAIHU_VOLUME:/app/data" \
            --env "TZ=Asia/Shanghai" \
            --env "BH_SERVER_PORT=8052" \
            --env "BH_SERVER_HOST=0.0.0.0" \
            --env "BH_DB_TYPE=sqlite" \
            --env "BH_DB_PATH=/app/data/baihu.db" \
            --env "BH_DB_TABLE_PREFIX=baihu_" \
            --env "BAIHU_SECRET_KEY=$BAIHU_SECRET_KEY"

      - name: Wait for Baihu
        shell: bash
        run: |
          set -euo pipefail

          echo "等待白虎面板进入 running 状态..."

          unikraft \
            --config "$UNIKRAFT_CONFIG" \
            --timeout 10m \
            instance wait "$BAIHU_INSTANCE" \
            --until 'state==running'

          echo "白虎面板已进入 running 状态。"

      - name: Show Baihu access URL
        shell: bash
        run: |
          set +e

          INSTANCE_INFO="$(
            unikraft \
              --config "$UNIKRAFT_CONFIG" \
              --timeout 10m \
              instances list 2>&1
          )"

          echo "$INSTANCE_INFO"

          FQDN="$(
            printf '%s\n' "$INSTANCE_INFO" \
              | grep -Eo '[a-zA-Z0-9.-]+\.(unikraft\.app|kraft\.host)' \
              | head -n 1
          )"

          if [ -n "$FQDN" ]; then
            BAIHU_URL="https://$FQDN"
          else
            BAIHU_URL="请查看上方实例列表中的 FQDN"
          fi

          {
            echo "## 白虎面板部署结果"
            echo
            echo "**访问地址：** $BAIHU_URL"
            echo
            echo "- Metro：$UKC_METRO"
            echo "- 实例：$BAIHU_INSTANCE"
            echo "- 端口：8052"
            echo "- 数据 Volume：$BAIHU_VOLUME"
            echo "- OpenList：未操作"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "========================================"
          echo "白虎面板访问地址：$BAIHU_URL"
          echo "========================================"
